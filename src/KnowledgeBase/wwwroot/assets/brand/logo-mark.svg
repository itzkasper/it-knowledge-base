<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="City of Homestead">
  <title>City of Homestead</title>

  <!--
    Mark only, theme-aware, for use anywhere an <img> is easier than inline
    SVG. The site's own topbar inlines this geometry instead so the tile can
    read CSS custom properties.

    Original design, not the City's official seal.
  -->
  <style>
    .tile  { fill: #116b63; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #14786e; }
    }
  </style>

  <rect class="tile" width="32" height="32" rx="7.5"/>

  <g fill="none" stroke="#ffffff" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 16.5 L16 9 L25.5 16.5"/>
    <path d="M10.5 22.5 H21.5"/>
  </g>
</svg>
